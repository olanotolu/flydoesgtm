<!doctype html>
<meta charset="utf-8">
<title>the fly got a job at clay</title>
<style>
:root{--bg:#0c0d0f;--panel:#141619;--line:#2a2d31;--muted:#858b91;--ink:#f1f2ee;--acid:#c8f169;--orange:#ff9a62;--red:#ff6b72;--blue:#82c9ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:12px ui-monospace,SFMono-Regular,Menlo,monospace}header{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 26px;justify-content:space-between}h1{font:600 19px Arial,sans-serif;letter-spacing:-.7px;margin:0}h1 span{color:var(--acid)}.sub{color:var(--muted);font-size:10px;margin-top:5px}.status{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:10px}.dot{width:7px;height:7px;background:var(--acid);border-radius:50%;box-shadow:0 0 10px var(--acid);animation:blink 2.4s infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}main{display:grid;grid-template-columns:43% 57%;height:calc(100vh - 68px);min-height:650px}.brain{position:relative;border-right:1px solid var(--line);background:radial-gradient(ellipse at center,#181c1b 0,#0c0d0f 67%);overflow:hidden}.brain canvas{width:100%;height:100%}.hud{position:absolute;left:24px;top:22px}.meta{color:var(--muted);line-height:1.8;margin-top:10px}.meta b{color:var(--ink);font-weight:400}.activity{position:absolute;bottom:22px;left:24px;color:var(--muted)}.activity b{color:var(--acid);font-size:18px}.table{background:#101113;overflow:hidden;position:relative;display:flex;flex-direction:column}.toolbar{height:54px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:14px;flex-shrink:0}.live-controls{display:flex;gap:8px;align-items:center;margin-left:auto;width:100%;justify-content:flex-end}.live-controls input{background:rgba(244,239,228,.045);border:1px solid var(--line);color:var(--ink);font:inherit;padding:8px 10px;flex:1;max-width:560px;outline:none}.live-controls input:focus{border-color:var(--acid)}.toolbar button.go{border:1px solid #4c5635;background:#20271a;color:var(--acid);font:inherit;padding:8px 12px;cursor:pointer}.toolbar button.go:hover{background:#2a341d}.toolbar button.go:disabled{opacity:.45;cursor:wait}.stats{display:flex;border-bottom:1px solid var(--line);height:72px;flex-shrink:0}.stat{padding:14px 20px;border-right:1px solid var(--line);flex:1}.stat label{color:var(--muted);display:block;font-size:9px;margin-bottom:8px}.stat b{font-size:17px;font-weight:400}.stat b.email{color:var(--acid)}.stat b.research{color:var(--blue)}.stat b.ignore{color:var(--muted)}.tablehead,.row{display:grid;grid-template-columns:1.25fr .65fr .75fr 1.4fr .7fr .8fr;gap:0;align-items:center}.tablehead{height:32px;color:var(--muted);font-size:9px;border-bottom:1px solid var(--line);padding:0 20px;flex-shrink:0}.rows{overflow-y:auto;flex:1}.row{min-height:68px;border-bottom:1px solid #202226;padding:0 20px;transition:background .2s;cursor:pointer}.row:hover{background:#1a1d20}.row.selected{background:#1b2116;box-shadow:inset 3px 0 0 var(--acid)}.row.stream-in{animation:streamin .5s ease-out}@keyframes streamin{0%{opacity:0;transform:translateX(14px)}100%{opacity:1;transform:none}}.company{font:bold 12px Arial,sans-serif}.domain{display:block;color:var(--muted);font-size:9px;margin-top:5px;font-weight:400}.signal{color:#c2c6c9;font-size:10px;line-height:1.4}.pill{display:inline-block;padding:4px 6px;border:1px solid var(--line);font-size:9px}.pill.green{color:var(--acid);border-color:#596b34}.action{font-weight:bold;color:var(--acid)}.action.wait{color:var(--muted)}.action.research{color:var(--blue)}.action.ignore{color:var(--red)}.drawer{border-top:1px solid var(--line);background:#121417;flex-shrink:0;max-height:0;overflow:hidden;transition:max-height .35s ease;display:flex;flex-direction:column}.drawer.open{max-height:262px}.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--line);flex-shrink:0}.drawer-head b{font:bold 12px Arial,sans-serif}.drawer-head span{color:var(--muted);font-size:10px}.drawer-body{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;padding:14px 20px;overflow-y:auto}.panel{padding:0 18px;border-right:1px solid var(--line)}.panel:last-child{border-right:0}.panel h4{margin:0 0 10px;color:var(--muted);font-size:9px;letter-spacing:.12em}.hbar{display:grid;grid-template-columns:76px 1fr 38px;align-items:center;gap:8px;margin-bottom:6px;font-size:10px}.hbar span:first-child{color:var(--muted)}.hbar span:last-child{color:var(--ink);text-align:right}.track{height:7px;background:#1d2023;position:relative}.fill{position:absolute;inset:0 auto 0 0;background:var(--muted);transition:width .4s}.fill.acid{background:var(--acid)}.fill.blue{background:var(--blue)}.fill.dim{background:#4a4f54}.poolrow{display:flex;justify-content:space-between;font-size:10px;margin-bottom:5px}.poolrow span:first-child{color:var(--muted)}.poolrow.hot span:last-child{color:var(--orange)}.compare{display:flex;gap:10px;align-items:center;margin-top:8px}.compare .badge{border:1px solid var(--line);padding:6px 10px;font-size:10px}.compare .badge.pre{color:var(--muted)}.compare .badge.post{color:var(--acid);border-color:#596b34}.footer{padding:8px 20px;color:var(--muted);font-size:10px;border-top:1px solid var(--line);flex-shrink:0;display:flex;justify-content:space-between}@media(max-width:900px){main{grid-template-columns:1fr}.brain{height:45vh;border-right:0;border-bottom:1px solid var(--line)}.table{height:55vh}.tablehead,.row{min-width:760px}.rows{overflow-x:auto}}
</style>
<header><div><h1>the fly got a job at <span>clay</span></h1><div class="sub">166,700 neurons. zero SDRs.</div></div><div class="status"><i class="dot"></i> LIVE</div></header>
<main><section class="brain"><canvas id="brain"></canvas><div class="hud"><div class="meta"><b style="color:var(--acid)">MALECNS V1.0</b><br>166,700 neurons<br><b id="soma">—</b> soma rendered</div></div><div class="activity">ACTIVITY <b id="activity">0.00</b></div></section><section class="table"><div class="toolbar"><div class="live-controls"><input id="clay-query" value='select from companies where industry = "Software Development"' placeholder='industry = "Wineries" — or just type plain text' spellcheck="false"><button id="clay-search" class="go">SEARCH</button></div></div><div class="stats"><div class="stat"><label>EVALUATED</label><b id="accounts">0</b></div><div class="stat"><label>EMAIL</label><b id="emails" class="email">0</b></div><div class="stat"><label>RESEARCH</label><b id="researches" class="research">0</b></div><div class="stat"><label>IGNORE</label><b id="ignores" class="ignore">0</b></div></div><div class="tablehead"><span>COMPANY</span><span>SIZE</span><span>FUNDING</span><span>SIGNAL</span><span>CONF</span><span>ACTION</span></div><div class="rows" id="rows"></div><div class="drawer" id="drawer"><div class="drawer-head"><b id="drawer-company">—</b><button id="compare-btn" class="go" style="padding:5px 10px;font-size:10px">COMPARE</button></div><div class="drawer-body"><div class="panel"><h4>SIGNALS</h4><div id="sig-bars"></div></div><div class="panel"><h4>P(ACTION)</h4><div id="act-bars"></div></div><div class="panel"><h4>POOLS / COST</h4><div id="pool-rows"></div><div id="cost-line" style="margin-top:8px;color:var(--muted);font-size:10px"></div><div class="compare" id="compare-out"></div></div></div></div><div class="footer"><span id="event">loading connectome…</span><span>clay public api · read-only</span></div></section></main>
<script>
const $=s=>document.querySelector(s);const canvas=$('#brain'),ctx=canvas.getContext('2d');let pts=[],activity=0,step=0,rot=0,playing=false,highlightChannels=new Set(),highlightPool=new Set(),idxMap=new Map(),graph=null;
function size(){canvas.width=canvas.clientWidth*devicePixelRatio;canvas.height=canvas.clientHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
async function loadBrain(){try{graph=await fetch('/graph').then(r=>r.json());const max=Math.min(24000,graph.points.length);pts=graph.points.slice(0,max).map((p,i)=>({x:p[0],y:p[1],z:p[2],phase:(i%97)*.11,id:graph.point_indices[i]}));graph.point_indices.slice(0,max).forEach((id,i)=>idxMap.set(id,i));$('#soma').textContent=max.toLocaleString()}catch(e){pts=[]}}
function draw(){let w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);rot+=.0028;step+=.5;let c=Math.cos(rot),s=Math.sin(rot),hot=playing?Math.min(1,activity+.15):.05+.03*Math.sin(step*.008);const projected=[];for(const p of pts){const x=p.x*c-p.z*s,z=p.x*s+p.z*c+2.3,scale=1.35/z;projected.push({x:w/2+x*scale*w*.8,y:h/2-p.y*scale*h*.8,z,scale,p})}projected.sort((a,b)=>b.z-a.z);ctx.globalCompositeOperation='lighter';for(const q of projected){const pulse=(Math.sin(step*.045+q.p.phase)+1)/2,glow=.3+pulse*(.3+hot*.7),a=glow*(.3+.7*(1-q.z/4));const hiC=highlightChannels.has(q.p.id),hiP=highlightPool.has(q.p.id);let r=Math.max(.6,(1.1+pulse*(.8+hot*1.8))*q.scale*2.8);if(hiC||hiP){r*=2.5;ctx.fillStyle=hiP?`rgba(255,154,98,${Math.min(1,a+.35)})`:`rgba(200,241,105,${Math.min(1,a+.35)})`}else{const g=Math.floor(140+pulse*70);ctx.fillStyle=`rgba(${Math.floor(g*.68)},${g},${Math.floor(g*.6)},${Math.min(1,a*1.5)})`}ctx.beginPath();ctx.arc(q.x,q.y,r,0,7);ctx.fill()}ctx.globalCompositeOperation='source-over';requestAnimationFrame(draw)}
function setHighlight(row){highlightChannels.clear();highlightPool.clear();if(!row||!graph)return;const ca=row.channel_activity||{};const top=Object.entries(ca).slice(0,6).sort((a,b)=>b[1]-a[1]).slice(0,2);for(const[ch,val]of top){if(val<=0)continue;for(const id of graph.channels[ch]||[]){const i=idxMap.get(id);if(i!==undefined)highlightChannels.add(graph.point_indices[i])}}const pool=row.decision&&graph.pools[row.decision];if(pool)for(const id of pool){const i=idxMap.get(id);if(i!==undefined)highlightPool.add(graph.point_indices[i])}}
function rowHTML(d){return `<div class="company">${d.company||'—'}<small class="domain">${d.domain||''}</small></div><span>${d.employees||'—'}</span><span class="pill ${String(d.funding).includes('unknown')?'':'green'}">${d.funding||'—'}</span><span class="signal">${d.signal||'—'}</span><span class="pill">${d.conf||'—'}</span><span class="action ${(d.action==='WAIT'||d.action==='IGNORE')?'wait':''} ${d.action==='RESEARCH'?'research':''} ${d.action==='IGNORE'?'ignore':''}">${d.action||'—'}</span>`}
function renderRow(data){const div=document.createElement('div');div.className='row';div.innerHTML=rowHTML(data);return div}
function bars(container,entries,cls){$(container).innerHTML=entries.map(([k,v])=>`<div class="hbar"><span>${k}</span><div class="track"><div class="fill ${cls||''}" style="width:${Math.round(Math.min(1,v)*100)}%"></div></div><span>${(+v).toFixed(2)}</span></div>`).join('')}
let liveRows=[],selectedRow=null;
function openDrawer(row){selectedRow=row;$('#drawer').classList.add('open');$('#drawer-company').textContent=row.company+(row.domain?' · '+row.domain:'');const sigs=[['funding',row.signals.funding],['hiring',row.signals.hiring],['intent',row.signals.intent],['job_change',row.signals.job_change],['negative',row.signals.negative],['trigger',row.signals.trigger]];bars('#sig-bars',sigs);bars('#act-bars',Object.entries(row.probabilities),row.decision==='EMAIL'?'acid':row.decision==='RESEARCH'?'blue':'dim');$('#pool-rows').innerHTML=Object.entries(row.pools).map(([p,v])=>`<div class="poolrow ${v>1?'hot':''}"><span>${p}</span><span>${v.toFixed(3)}</span></div>`).join('');$('#cost-line').textContent='$'+row.costs[row.decision]+' · read-only';$('#compare-out').innerHTML='';setHighlight(row);$('#event').textContent=(row.company||'')+' → '+row.decision}
async function compare(){if(!selectedRow)return;$('#compare-btn').disabled=true;try{const post=await fetch('/decide',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({signals:selectedRow.signals,policy:'post'})}).then(r=>r.json());const pre=await fetch('/decide',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({signals:selectedRow.signals,policy:'pre'})}).then(r=>r.json());$('#compare-out').innerHTML=`<span class="badge pre">PRE ${pre.decision} ${(100*pre.confidence).toFixed(0)}%</span><span class="badge post">POST ${post.decision} ${(100*post.confidence).toFixed(0)}%</span>`}catch(e){$('#compare-out').innerHTML='<span style="color:var(--red)">compare failed</span>'}finally{$('#compare-btn').disabled=false}}
async function goLive(){const q=$('#clay-query').value.trim();if(!q)return;$('#clay-search').disabled=true;$('#clay-search').textContent='SEARCHING…';$('#rows').innerHTML='';$('#event').textContent='querying clay…';try{const res=await fetch('/live?query='+encodeURIComponent(q)+'&limit=10').then(r=>r.json());if(res.error)throw new Error(res.error);liveRows=res.rows;const dist=res.distribution||{};$('#accounts').textContent=liveRows.length;$('#emails').textContent=dist.EMAIL||0;$('#researches').textContent=dist.RESEARCH||0;$('#ignores').textContent=dist.IGNORE||0;liveRows.forEach((r,i)=>{setTimeout(()=>{const div=renderRow({company:r.company,domain:r.domain,employees:(r.size||'—').replace('10,001+','10k+'),funding:'F '+(r.signals.funding||0).toFixed(2),signal:(r.industry||'')+' · '+(r.location||''),conf:(100*r.confidence).toFixed(0)+'%',action:r.decision});div.classList.add('stream-in');div.onclick=()=>{document.querySelectorAll('.row').forEach(x=>x.classList.remove('selected'));div.classList.add('selected');openDrawer(r)};$('#rows').appendChild(div);const ca=r.channel_activity||{};const avg=Object.values(ca).reduce((a,v)=>a+v,0)/(Object.keys(ca).length||1);activity=Math.min(1,.3+avg*2);$('#activity').textContent=activity.toFixed(2);playing=true;setTimeout(()=>playing=false,600);$('#event').textContent=(i+1)+'/'+liveRows.length+' · '+(r.company||'')+' → '+r.decision},i*320)});$('#event').textContent='evaluated '+liveRows.length+' companies'}catch(e){$('#event').textContent='live search failed: '+e.message}finally{$('#clay-search').disabled=false;$('#clay-search').textContent='SEARCH'}}
$('#clay-search').onclick=goLive;$('#clay-query').addEventListener('keydown',e=>{if(e.key==='Enter')goLive()});$('#compare-btn').onclick=compare;
async function boot(){await loadBrain();$('#event').textContent='connectome loaded';goLive()}
window.addEventListener('resize',size);size();draw();boot();
</script>
